<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)" rx="12" />
  <rect width="1100" height="680" fill="url(#grid)" rx="12" />
  <rect x="12" y="12" width="1076" height="656" fill="none" stroke="#334155" stroke-width="1.5" rx="8" />

  <!-- Title Block -->
  <rect x="32" y="28" width="1036" height="58" fill="#0F172A" stroke="#334155" stroke-width="1" rx="6" />
  <text x="52" y="54" fill="#F8FAFC" font-size="16" font-weight="bold">HARDWARE SCHEMATIC &amp; WIRING DIAGRAM — ESP32-C3 + GC9A01 (240x240 SPI) + DHT11</text>
  <text x="52" y="74" fill="#94A3B8" font-size="11">Bus: SPI2_HOST @ 20MHz Write | Radio TX: WIFI_POWER_8_5dBm | Supply: 3.3V Logic Regulated | THE IoT MAKER</text>
  <text x="1048" y="54" fill="#38BDF8" font-size="12" text-anchor="end" font-weight="bold">REV 1.0</text>
  <text x="1048" y="74" fill="#64748B" font-size="11" text-anchor="end">SHEET 1 OF 1</text>

  <!-- ================= POWER RAILS ================= -->
  <!-- 3.3V Rail -->
  <path d="M 280 135 L 920 135" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6 3" />
  <text x="285" y="126" fill="#EF4444" font-size="11" font-weight="bold">+3.3V VCC RAIL (REGULATED)</text>

  <!-- GND Rail -->
  <path d="M 280 585 L 920 585" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 3" />
  <text x="285" y="604" fill="#94A3B8" font-size="11" font-weight="bold">COMMON GROUND (GND)</text>

  <!-- ================= MODULE 1: ESP32-C3 MCU ================= -->
  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="260" height="370" fill="#111827" stroke="#38BDF8" stroke-width="2" rx="10" />
    <rect x="16" y="16" width="228" height="42" fill="#1E293B" stroke="#334155" rx="6" />
    <text x="130" y="36" fill="#38BDF8" font-size="14" font-weight="bold" text-anchor="middle">ESP32-C3 MCU</text>
    <text x="130" y="51" fill="#94A3B8" font-size="10" text-anchor="middle">RISC-V @ 160MHz · Wi-Fi 2.4GHz</text>

    <!-- Left Info -->
    <text x="22" y="90" fill="#64748B" font-size="10">SPI2_HOST CONFIG:</text>
    <text x="22" y="106" fill="#CBD5E1" font-size="10">freq_write: 20 MHz</text>
    <text x="22" y="122" fill="#CBD5E1" font-size="10">spi_mode: 0</text>
    <text x="22" y="138" fill="#CBD5E1" font-size="10">TX Power: 8.5 dBm</text>

    <!-- Right-side Pins -->
    <!-- 3V3 -->
    <rect x="248" y="68" width="18" height="12" fill="#EF4444" rx="2" />
    <text x="238" y="78" fill="#FCA5A5" font-size="11" font-weight="bold" text-anchor="end">3V3</text>

    <!-- GPIO 4 (SCLK) -->
    <rect x="248" y="118" width="18" height="12" fill="#F59E0B" rx="2" />
    <text x="238" y="128" fill="#FDE68A" font-size="11" font-weight="bold" text-anchor="end">GPIO 4 (SCLK)</text>

    <!-- GPIO 6 (MOSI) -->
    <rect x="248" y="158" width="18" height="12" fill="#10B981" rx="2" />
    <text x="238" y="168" fill="#A7F3D0" font-size="11" font-weight="bold" text-anchor="end">GPIO 6 (MOSI)</text>

    <!-- GPIO 1 (DC) -->
    <rect x="248" y="198" width="18" height="12" fill="#38BDF8" rx="2" />
    <text x="238" y="208" fill="#BAE6FD" font-size="11" font-weight="bold" text-anchor="end">GPIO 1 (DC)</text>

    <!-- GPIO 7 (CS) -->
    <rect x="248" y="238" width="18" height="12" fill="#A855F7" rx="2" />
    <text x="238" y="248" fill="#E9D5FF" font-size="11" font-weight="bold" text-anchor="end">GPIO 7 (CS)</text>

    <!-- GPIO 0 (RST) -->
    <rect x="248" y="278" width="18" height="12" fill="#EC4899" rx="2" />
    <text x="238" y="288" fill="#FBCFE8" font-size="11" font-weight="bold" text-anchor="end">GPIO 0 (RST)</text>

    <!-- GPIO 3 (DHT11) -->
    <rect x="248" y="318" width="18" height="12" fill="#22D3EE" rx="2" />
    <text x="238" y="328" fill="#CFFAFE" font-size="11" font-weight="bold" text-anchor="end">GPIO 3 (DATA)</text>

    <!-- GND -->
    <rect x="248" y="346" width="18" height="12" fill="#64748B" rx="2" />
    <text x="238" y="356" fill="#CBD5E1" font-size="11" font-weight="bold" text-anchor="end">GND</text>
  </g>

  <!-- ================= MODULE 2: GC9A01 240x240 ROUND TFT ================= -->
  <g transform="translate(690, 155)">
    <rect x="0" y="0" width="340" height="270" fill="#111827" stroke="#38BDF8" stroke-width="2" rx="10" />
    <text x="215" y="28" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">GC9A01 ROUND IPS TFT</text>
    <text x="215" y="45" fill="#94A3B8" font-size="10" text-anchor="middle">240x240 RGB565 · LovyanGFX Driver</text>

    <!-- Simulated Circular Screen -->
    <circle cx="225" cy="148" r="82" fill="#000000" stroke="#1E3A8A" stroke-width="3" />
    <circle cx="225" cy="148" r="76" fill="none" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="4 2" />
    <!-- Robotic Eyes Preview -->
    <rect x="180" y="122" width="32" height="26" rx="7" fill="#06B6D4" />
    <circle cx="196" cy="135" r="5" fill="#000000" />
    <circle cx="194" cy="133" r="2" fill="#FFFFFF" />
    <rect x="238" y="122" width="32" height="26" rx="7" fill="#06B6D4" />
    <circle cx="254" cy="135" r="5" fill="#000000" />
    <circle cx="252" cy="133" r="2" fill="#FFFFFF" />
    <text x="225" y="195" fill="#38BDF8" font-size="9" text-anchor="middle">THE IoT MAKER</text>

    <!-- Left-side Pins on GC9A01 -->
    <rect x="-6" y="48" width="18" height="12" fill="#EF4444" rx="2" />
    <text x="20" y="58" fill="#FCA5A5" font-size="11" font-weight="bold">VCC (3.3V)</text>

    <rect x="-6" y="76" width="18" height="12" fill="#64748B" rx="2" />
    <text x="20" y="86" fill="#CBD5E1" font-size="11" font-weight="bold">GND</text>

    <rect x="-6" y="108" width="18" height="12" fill="#F59E0B" rx="2" />
    <text x="20" y="118" fill="#FDE68A" font-size="11" font-weight="bold">SCL / SCK</text>

    <rect x="-6" y="148" width="18" height="12" fill="#10B981" rx="2" />
    <text x="20" y="158" fill="#A7F3D0" font-size="11" font-weight="bold">SDA / MOSI</text>

    <rect x="-6" y="188" width="18" height="12" fill="#38BDF8" rx="2" />
    <text x="20" y="198" fill="#BAE6FD" font-size="11" font-weight="bold">DC</text>

    <rect x="-6" y="228" width="18" height="12" fill="#A855F7" rx="2" />
    <text x="20" y="238" fill="#E9D5FF" font-size="11" font-weight="bold">CS</text>

    <rect x="-6" y="252" width="18" height="12" fill="#EC4899" rx="2" />
    <text x="20" y="262" fill="#FBCFE8" font-size="11" font-weight="bold">RST / RES</text>
  </g>

  <!-- ================= MODULE 3: DHT11 SENSOR ================= -->
  <g transform="translate(690, 450)">
    <rect x="0" y="0" width="340" height="115" fill="#111827" stroke="#22D3EE" stroke-width="2" rx="10" />
    <text x="195" y="28" fill="#22D3EE" font-size="14" font-weight="bold" text-anchor="middle">DHT11 SENSOR MODULE</text>
    <text x="195" y="45" fill="#94A3B8" font-size="10" text-anchor="middle">Temperature (°C) &amp; Relative Humidity (%)</text>
    <text x="195" y="68" fill="#CBD5E1" font-size="10" text-anchor="middle">Sample Period: 2500ms Async</text>
    <text x="195" y="86" fill="#64748B" font-size="10" text-anchor="middle">10kΩ Pull-Up on DATA to 3.3V</text>

    <!-- Pins -->
    <rect x="-6" y="22" width="18" height="12" fill="#EF4444" rx="2" />
    <text x="20" y="32" fill="#FCA5A5" font-size="11" font-weight="bold">VCC (3.3V)</text>

    <rect x="-6" y="52" width="18" height="12" fill="#22D3EE" rx="2" />
    <text x="20" y="62" fill="#CFFAFE" font-size="11" font-weight="bold">DATA (OUT)</text>

    <rect x="-6" y="82" width="18" height="12" fill="#64748B" rx="2" />
    <text x="20" y="92" fill="#CBD5E1" font-size="11" font-weight="bold">GND</text>
  </g>

  <!-- ================= WIRING NETS ================= -->
  <!-- ESP32 3V3 to 3.3V Rail -->
  <path d="M 326 244 L 354 244 L 354 135" fill="none" stroke="#EF4444" stroke-width="2.5" />
  <circle cx="354" cy="135" r="4" fill="#EF4444" />

  <!-- GC9A01 VCC to 3.3V Rail -->
  <path d="M 684 209 L 656 209 L 656 135" fill="none" stroke="#EF4444" stroke-width="2.5" />
  <circle cx="656" cy="135" r="4" fill="#EF4444" />

  <!-- DHT11 VCC to 3.3V Rail -->
  <path d="M 684 478 L 656 478 L 656 209" fill="none" stroke="#EF4444" stroke-width="2.5" />
  <circle cx="656" cy="209" r="4" fill="#EF4444" />

  <!-- ESP32 GND to GND Rail -->
  <path d="M 326 522 L 354 522 L 354 585" fill="none" stroke="#64748B" stroke-width="2.5" />
  <circle cx="354" cy="585" r="4" fill="#64748B" />

  <!-- GC9A01 GND to GND Rail -->
  <path d="M 684 237 L 670 237 L 670 585" fill="none" stroke="#64748B" stroke-width="2.5" />
  <circle cx="670" cy="585" r="4" fill="#64748B" />

  <!-- DHT11 GND to GND Rail -->
  <path d="M 684 538 L 670 538" fill="none" stroke="#64748B" stroke-width="2.5" />
  <circle cx="670" cy="538" r="4" fill="#64748B" />

  <!-- GPIO 4 -> SCL (SCLK) -->
  <path d="M 326 294 L 590 294 L 590 269 L 684 269" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <text x="372" y="286" fill="#FDE68A" font-size="10">SPI SCLK (GPIO 4)</text>

  <!-- GPIO 6 -> SDA (MOSI) -->
  <path d="M 326 334 L 605 334 L 605 309 L 684 309" fill="none" stroke="#10B981" stroke-width="2.5" />
  <text x="372" y="326" fill="#A7F3D0" font-size="10">SPI MOSI (GPIO 6)</text>

  <!-- GPIO 1 -> DC -->
  <path d="M 326 374 L 620 374 L 620 349 L 684 349" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <text x="372" y="366" fill="#BAE6FD" font-size="10">DATA/CMD (GPIO 1)</text>

  <!-- GPIO 7 -> CS -->
  <path d="M 326 414 L 632 414 L 632 389 L 684 389" fill="none" stroke="#A855F7" stroke-width="2.5" />
  <text x="372" y="406" fill="#E9D5FF" font-size="10">CHIP SEL (GPIO 7)</text>

  <!-- GPIO 0 -> RST -->
  <path d="M 326 454 L 644 454 L 644 413 L 684 413" fill="none" stroke="#EC4899" stroke-width="2.5" />
  <text x="372" y="446" fill="#FBCFE8" font-size="10">RESET (GPIO 0)</text>

  <!-- GPIO 3 -> DHT11 DATA -->
  <path d="M 326 494 L 580 494 L 580 508 L 684 508" fill="none" stroke="#22D3EE" stroke-width="2.5" />
  <text x="372" y="486" fill="#CFFAFE" font-size="10">1-WIRE DATA (GPIO 3)</text>
</svg>
